apiVersion: platform.secureai.io/v1alpha1
kind: AIProfile

metadata:
  name: general-long

spec:
  displayName: General Long

  description: >
    Profil généraliste destiné aux conversations longues,
    aux réponses détaillées et aux prompts contenant davantage
    de contexte ou de documents.

  category: general

  defaults:
    maxModelLen: 8192
    maxTokens: 2048
    temperature: 0.2
    topP: 0.9

  replicas: 1

  resources:
    requests:
      cpu: 500m
      memory: 1Gi

    limits:
      cpu: "2"
      memory: 4Gi

  storage:
    modelCache:
      enabled: true
      size: 70Gi
      mountPath: /models/model

  runtimePolicy:
    preferredRuntimes:
      - vllm-cuda
      - llama-cpp-cuda
      - vllm-metal
      - llama-cpp-metal

    allowedRuntimes:
      - vllm-cuda
      - llama-cpp-cuda
      - vllm-metal
      - llama-cpp-metal

  limits:
    maxModelLen: 16384
    maxTokens: 4096

    temperature:
      min: 0.0
      max: 1.0

    topP:
      min: 0.1
      max: 1.0

  inference:
    streaming: true
    timeoutSeconds: 180

    concurrency:
      maxRequests: 4

  security:
    allowUserOverrides: true

    overridableParameters:
      - temperature
      - maxTokens
      - topP
      - runtimeCapacity
