apiVersion: platform.secureai.io/v1alpha1
kind: AIProfile

metadata:
  name: interactive

spec:
  displayName: Interactive

  description: >
    Profil généraliste pour chat interactif avec une latence faible,
    des réponses courtes à moyennes et une consommation maîtrisée.

  category: interactive

  defaults:
    maxModelLen: 4096
    maxTokens: 512
    temperature: 0.2
    topP: 0.9

  replicas: 1

  resources:
    requests:
      cpu: 500m
      memory: 1Gi

    limits:
      cpu: "2"
      memory: 4Gi

  storage:
    modelCache:
      enabled: true
      size: 70Gi
      mountPath: /models/model

  runtimePolicy:
    preferredRuntimes:
      - vllm-cuda
      - llama-cpp-cuda
      - vllm-metal
      - llama-cpp-metal

    allowedRuntimes:
      - vllm-cuda
      - llama-cpp-cuda
      - vllm-metal
      - llama-cpp-metal

  limits:
    maxModelLen: 8192
    maxTokens: 2048

    temperature:
      min: 0.0
      max: 1.0

    topP:
      min: 0.1
      max: 1.0

  inference:
    streaming: true
    timeoutSeconds: 120

    concurrency:
      maxRequests: 4

  security:
    allowUserOverrides: true

    overridableParameters:
      - temperature
      - maxTokens
      - topP
      - runtimeCapacity
