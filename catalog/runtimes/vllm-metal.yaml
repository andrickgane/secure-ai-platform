apiVersion: platform.secureai.io/v1alpha1
kind: AIRuntime

metadata:
  name: vllm-metal

spec:
  displayName: vLLM Metal

  description: >
    External vLLM inference runtime optimized for Apple Silicon.
    Model governance, trusted artifact verification and runtime
    orchestration remain centralized in the AI Control Plane while
    inference execution is performed on the external Metal host.

  engine: vllm

  artifactFormats:
    - safetensors

  compatibility:
    artifactFormats:
      - safetensors

    quantizations:
      - BF16
      - FP16
      - FP32

  deploymentMode: external

  endpoint:
    scheme: http
    host: llm-runtime.ai-workloads.svc.cluster.local
    port: 8000

  management:
    type: ssh
    host: 192.168.64.1
    port: 22

  hardware:
    accelerator: apple-metal
    gpuCount: 0

  capabilities:
    - chat
    - text-generation
    - reasoning

  security:
    authentication:
      type: bearer-token

    internetRequired: false
