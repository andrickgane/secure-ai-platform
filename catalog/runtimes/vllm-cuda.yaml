apiVersion: platform.secureai.io/v1alpha1
kind: Runtime
metadata:
  name: vllm-cuda
spec:
  displayName: vLLM CUDA
  description: >
    Runtime vLLM Kubernetes pour worker NVIDIA.
    Il reste indisponible tant que le cluster n'expose aucun nvidia.com/gpu.
  engine: vllm
  deploymentMode: kubernetes
  container:
    image: vllm/vllm-openai:v0.26.0
    port: 8000
  hardware:
    accelerator: nvidia
    resourceName: nvidia.com/gpu
    gpuCount: 1
  scheduling:
    nodeSelector:
      accelerator: nvidia
  capabilities:
    - chat
    - text-generation
    - reasoning
  security:
    approved: true
