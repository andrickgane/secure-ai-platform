apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: model-promotion-egress
  namespace: ai-workloads

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: model-promotion

  policyTypes:
    - Egress

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-system
      ports:
        - protocol: TCP
          port: 5432

    - to:
        - ipBlock:
            cidr: 10.96.30.59/32
      ports:
        - protocol: TCP
          port: 443
