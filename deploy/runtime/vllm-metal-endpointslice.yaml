apiVersion: discovery.k8s.io/v1
kind: EndpointSlice

metadata:
  name: llm-runtime-external
  namespace: ai-workloads

  labels:
    kubernetes.io/service-name: llm-runtime

addressType: IPv4

ports:
  - name: http
    protocol: TCP
    port: 8000

endpoints:
  - addresses:
      - "192.0.2.20"

    conditions:
      ready: true
