apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: ai-control-plane
  namespace: ai-system

spec:

  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-control-plane

  policyTypes:
    - Ingress
    - Egress

  ingress:

    - from:

        - namespaceSelector: {}

      ports:

        - protocol: TCP
          port: 8080

  egress:

    # DNS
    - to:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system

      ports:

        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53

    # PostgreSQL
    - to:

        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres

      ports:

        - protocol: TCP
          port: 5432

    # vLLM runtime
    - to:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-workloads

      ports:

        - protocol: TCP
          port: 8000

    # Local trusted OCI registry
    - to:

        - ipBlock:
            cidr: 0.0.0.0/0

      ports:

        - protocol: TCP
          port: 31039

    # Sigstore verification endpoints
    - to:

        - ipBlock:
            cidr: 0.0.0.0/0

      ports:

        - protocol: TCP
          port: 443
