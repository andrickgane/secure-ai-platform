apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-control-plane
  namespace: ai-system
  labels:
    app.kubernetes.io/name: ai-control-plane
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-control-plane
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/part-of: ai-platform
    spec:
      hostAliases:
      - ip: 192.0.2.203
        hostnames:
        - registry.secure-ai.local
      serviceAccountName: ai-control-plane
      imagePullSecrets:
      - name: zot-regcred
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
      - name: database-migration
        image: registry.secure-ai.local:5000/ai-platform/control-plane:v1.0.1
        imagePullPolicy: Always
        command:
        - alembic
        - upgrade
        - head
        envFrom:
        - secretRef:
            name: ai-control-plane-secrets
        env:
        - name: ACP_ENVIRONMENT
          value: kubernetes
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: api
        image: registry.secure-ai.local:5000/ai-platform/control-plane:v1.0.1
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        envFrom:
        - secretRef:
            name: ai-control-plane-secrets
        env:
        - name: ACP_ENVIRONMENT
          value: kubernetes
        - name: ACP_KUBERNETES_NAMESPACE
          value: ai-workloads
        - name: ACP_KUBERNETES_MODE
          value: incluster
        - name: ACP_REGISTRY_INSECURE
          value: 'true'
        - name: ACP_JWT_ALGORITHM
          value: HS256
        - name: ACP_JWT_ACCESS_TOKEN_MINUTES
          value: '60'
        - name: HOME
          value: /home/appuser
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: sigstore-cache
          mountPath: /home/appuser/.sigstore
      volumes:
      - name: tmp
        emptyDir: {}
      - name: sigstore-cache
        emptyDir: {}
