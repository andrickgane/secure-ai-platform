apiVersion: v1
kind: Service

metadata:
  name: ai-control-plane
  namespace: ai-system

  labels:
    app.kubernetes.io/name: ai-control-plane
    app.kubernetes.io/component: control-plane

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: ai-control-plane

  ports:

    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
