apiVersion: v1
kind: ServiceAccount

metadata:
  name: ai-control-plane
  namespace: ai-system

automountServiceAccountToken: true

---

apiVersion: v1
kind: ServiceAccount

metadata:
  name: model-ingestion
  namespace: ai-workloads

automountServiceAccountToken: true

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: ai-control-plane-workloads
  namespace: ai-workloads

rules:

  - apiGroups:
      - apps

    resources:
      - deployments

    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - batch

    resources:
      - jobs

    verbs:
      - get
      - list
      - watch
      - create
      - delete

  - apiGroups:
      - ""

    resources:
      - pods
      - services
      - persistentvolumeclaims
      - configmaps

    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - ""

    resources:
      - secrets

    verbs:
      - get

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: ai-control-plane-workloads
  namespace: ai-workloads

subjects:

  - kind: ServiceAccount
    name: ai-control-plane
    namespace: ai-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-control-plane-workloads

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: ai-control-plane-capacity-reader

rules:

  - apiGroups:
      - ""

    resources:
      - nodes

    verbs:
      - get
      - list

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: ai-control-plane-capacity-reader

subjects:

  - kind: ServiceAccount
    name: ai-control-plane
    namespace: ai-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-control-plane-capacity-reader
