# ==========================================================
# AI CONTROL PLANE SERVICE ACCOUNT
# ==========================================================
#
# The Control Plane runs in ai-system.
#
# It needs a Kubernetes API token because it orchestrates:
# - model ingestion Jobs
# - model promotion Jobs
# - runtime activation Jobs
# - Kubernetes AI Deployments
# - Kubernetes Services
# - node capacity discovery
#
# Permissions are deliberately scoped to ai-workloads
# whenever possible.
# ==========================================================

apiVersion: v1
kind: ServiceAccount

metadata:
  name: ai-control-plane
  namespace: ai-system

  labels:
    app.kubernetes.io/name: ai-control-plane
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: ai-platform

automountServiceAccountToken: true

---

# ==========================================================
# AI-WORKLOADS ORCHESTRATION ROLE
# ==========================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: ai-control-plane-workloads
  namespace: ai-workloads

  labels:
    app.kubernetes.io/name: ai-control-plane
    app.kubernetes.io/component: workload-orchestrator
    app.kubernetes.io/part-of: ai-platform

rules:

  # --------------------------------------------------------
  # Lifecycle workers:
  #
  # - model ingestion
  # - model promotion
  # - runtime activation
  # --------------------------------------------------------

  - apiGroups:
      - batch

    resources:
      - jobs

    verbs:
      - create
      - get
      - list
      - watch
      - delete

  # --------------------------------------------------------
  # Kubernetes inference runtimes
  # --------------------------------------------------------

  - apiGroups:
      - apps

    resources:
      - deployments

    verbs:
      - create
      - get
      - list
      - watch
      - delete

  # --------------------------------------------------------
  # Runtime ClusterIP Services
  # --------------------------------------------------------

  - apiGroups:
      - ""

    resources:
      - services

    verbs:
      - create
      - get
      - list
      - watch
      - delete

  # --------------------------------------------------------
  # Read-only workload inspection
  #
  # No pod create/delete/exec permission.
  # Jobs and Deployments create their own Pods.
  # --------------------------------------------------------

  - apiGroups:
      - ""

    resources:
      - pods

    verbs:
      - get
      - list
      - watch

---

# ==========================================================
# BIND CONTROL PLANE TO AI-WORKLOADS ROLE
# ==========================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: ai-control-plane-workloads
  namespace: ai-workloads

  labels:
    app.kubernetes.io/name: ai-control-plane
    app.kubernetes.io/component: workload-orchestrator
    app.kubernetes.io/part-of: ai-platform

subjects:

  - kind: ServiceAccount
    name: ai-control-plane
    namespace: ai-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-control-plane-workloads

---

# ==========================================================
# CLUSTER NODE CAPACITY READER
# ==========================================================
#
# RuntimeSelectorService / KubernetesService needs to inspect
# allocatable GPU capacity on Kubernetes nodes.
#
# This role is deliberately read-only.
# ==========================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: ai-control-plane-capacity-reader

  labels:
    app.kubernetes.io/name: ai-control-plane
    app.kubernetes.io/component: capacity-reader
    app.kubernetes.io/part-of: ai-platform

rules:

  - apiGroups:
      - ""

    resources:
      - nodes

    verbs:
      - get
      - list

---

# ==========================================================
# NODE CAPACITY READER BINDING
# ==========================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: ai-control-plane-capacity-reader

  labels:
    app.kubernetes.io/name: ai-control-plane
    app.kubernetes.io/component: capacity-reader
    app.kubernetes.io/part-of: ai-platform

subjects:

  - kind: ServiceAccount
    name: ai-control-plane
    namespace: ai-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-control-plane-capacity-reader
