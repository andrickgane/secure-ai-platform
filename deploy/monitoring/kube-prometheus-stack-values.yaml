# ==========================================================
# AI PLATFORM - KUBERNETES MONITORING
# ==========================================================

# ----------------------------------------------------------
# PROMETHEUS
# ----------------------------------------------------------

prometheus:
  enabled: true

  prometheusSpec:
    retention: 15d

    scrapeInterval: 15s
    evaluationInterval: 15s

    # Allow our future ServiceMonitor / PodMonitor resources
    # without requiring the Helm release label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path

          accessModes:
            - ReadWriteOnce

          resources:
            requests:
              storage: 20Gi


# ----------------------------------------------------------
# GRAFANA
# ----------------------------------------------------------

grafana:
  enabled: true

  persistence:
    enabled: true
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  service:
    type: ClusterIP

  defaultDashboardsEnabled: true


# ----------------------------------------------------------
# ALERTMANAGER
# ----------------------------------------------------------

alertmanager:
  enabled: true


# ----------------------------------------------------------
# KUBERNETES METRICS
# ----------------------------------------------------------

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true


# ----------------------------------------------------------
# COMPONENTS NOT REQUIRED IN THIS LAB
# ----------------------------------------------------------

windowsMonitoring:
  enabled: false

# ----------------------------------------------------------
# LOCAL REGISTRY OVERRIDES
# ----------------------------------------------------------

prometheusOperator:
  admissionWebhooks:
    patch:
      image:
        registry: registry.andrick.local:31039
        repository: monitoring/kube-webhook-certgen
        tag: 1.8.5
        pullPolicy: IfNotPresent
