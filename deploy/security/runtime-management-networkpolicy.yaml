apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-control-plane-runtime-management
  namespace: ai-system
  labels:
    app.kubernetes.io/name: ai-control-plane
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: ai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-control-plane
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.64.1/32
      ports:
        - protocol: TCP
          port: 22
