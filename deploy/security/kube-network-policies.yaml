apiVersion: v1
kind: ServiceAccount

metadata:
  name: kube-network-policies
  namespace: kube-system

  labels:
    app.kubernetes.io/name: kube-network-policies
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: ai-platform

automountServiceAccountToken: true

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: kube-network-policies

  labels:
    app.kubernetes.io/name: kube-network-policies
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: ai-platform

rules:

  - apiGroups:
      - ""

    resources:
      - pods
      - namespaces

    verbs:
      - list
      - watch

  - apiGroups:
      - networking.k8s.io

    resources:
      - networkpolicies

    verbs:
      - list
      - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: kube-network-policies

  labels:
    app.kubernetes.io/name: kube-network-policies
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: ai-platform

subjects:

  - kind: ServiceAccount
    name: kube-network-policies
    namespace: kube-system

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-network-policies

---

apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: kube-network-policies
  namespace: kube-system

  labels:
    app.kubernetes.io/name: kube-network-policies
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: ai-platform

spec:

  selector:
    matchLabels:
      app.kubernetes.io/name: kube-network-policies

  template:

    metadata:
      labels:
        app.kubernetes.io/name: kube-network-policies
        app.kubernetes.io/component: network-security
        app.kubernetes.io/part-of: ai-platform

    spec:

      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      serviceAccountName: kube-network-policies

      nodeSelector:
        kubernetes.io/os: linux

      tolerations:

        - operator: Exists
          effect: NoSchedule

        - operator: Exists
          effect: NoExecute

      containers:

        - name: kube-network-policies

          image: registry.k8s.io/networking/kube-network-policies:v1.0.0

          imagePullPolicy: IfNotPresent

          args:

            - /bin/netpol

            - --hostname-override=$(MY_NODE_NAME)

            - --v=2

            # This kubeadm/containerd cluster does not expose
            # the NRI socket.
            - --disable-nri=true

            # ==================================================
            # SECURITY
            #
            # Network-policy enforcement is now fully validated.
            #
            # Do NOT bypass policies if the policy engine
            # encounters a failure.
            # ==================================================
            - --fail-open=false

            - --strict-mode=true

          env:

            - name: MY_NODE_NAME

              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          resources:

            requests:
              cpu: 100m
              memory: 50Mi

            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:

            privileged: true

            capabilities:
              add:
                - NET_ADMIN

          volumeMounts:

            - name: netns
              mountPath: /var/run/netns
              mountPropagation: HostToContainer

      volumes:

        - name: netns

          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
