apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-workloads-network-policy
  namespace: ai-workloads
spec:
  podSelector: {}

  policyTypes:
    - Ingress
    - Egress

  egress:

  # DNS
  - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
    ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53

  # Kubernetes API
  - to:
      - ipBlock:
          cidr: 10.96.0.1/32
    ports:
      - protocol: TCP
        port: 443
