apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runtime-activation-egress
  namespace: ai-workloads
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: runtime-activation
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: registry
      ports:
        - {protocol: TCP, port: 5000}

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-system
      ports:
        - {protocol: TCP, port: 8080}

    - to:
        - ipBlock:
            cidr: 192.0.2.20/32
      ports:
        - {protocol: TCP, port: 22}
        - {protocol: TCP, port: 8000}
