apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: model-ingestion-egress
  namespace: ai-workloads

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: model-ingestion

  policyTypes:
    - Egress

  egress:

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system

      ports:
        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53

    - ports:
        - protocol: TCP
          port: 443
